# Namespace для приложения
apiVersion: v1
kind: Namespace
metadata:
  name: todoapp

---
# Secret с данными подключения к БД для Django приложения
apiVersion: v1
kind: Secret
metadata:
  name: todoapp-db-secret
  namespace: todoapp
type: Opaque
data:
  # NAME: tododb (base64 encoded)
  NAME: dG9kb2Ri
  # USER: todouser (base64 encoded)
  USER: dG9kb3VzZXI=
  # PASSWORD: todopassword (base64 encoded)
  PASSWORD: dG9kb3Bhc3N3b3Jk
  # HOST: mysql-0.mysql-headless.mysql.svc.cluster.local (base64 encoded)
  HOST: bXlzcWwtMC5teXNxbC1oZWFkbGVzcy5teXNxbC5zdmMuY2x1c3Rlci5sb2NhbA==

---
# Service для Django приложения
apiVersion: v1
kind: Service
metadata:
  name: todoapp-service
  namespace: todoapp
  labels:
    app: todoapp
spec:
  type: NodePort
  selector:
    app: todoapp
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30007
      name: http

---
# Deployment для Django приложения
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    app: todoapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      containers:
        - name: todoapp
          image: todoapp:latest
          imagePullPolicy: Never # Для локальной разработки с kind
          ports:
            - containerPort: 8000
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: todoapp-db-secret
                  key: NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: todoapp-db-secret
                  key: USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todoapp-db-secret
                  key: PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: todoapp-db-secret
                  key: HOST
            - name: DB_PORT
              value: "3306"
            - name: SECRET_KEY
              value: "django-insecure-development-key-change-in-production"
          # Liveness Probe
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness Probe
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          # Resource requests и limits
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
